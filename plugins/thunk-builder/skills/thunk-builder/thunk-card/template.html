<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: a Thunk.AI brand bar, a header card for the thunk, then its body by kind. Workflow and chat
   thunks: work items, then the Workflow Plan beside its contract and state.
   MCP-server thunks: the exported interface, a tool list beside one tool's
   detail (parameters, call history, try it).
   Tokens follow the Thunk.AI web app (webapp themeTokens / customTheme):
   Roboto 400/500, ink #212121, gold #fbd374, grey 50/200 surfaces, MUI
   semantic colours, 8px grid, 8px card and 16px chip corners. */
:root {
  --bg: #f5f5f5;
  --surface: #ffffff;
  --ink: #212121;
  --muted: #616161;
  --disabled: #9e9e9e;
  --line: #e0e0e0;
  --line-strong: #bdbdbd;
  --hover: rgba(0, 0, 0, 0.04);
  --accent: #fbd374;
  --accent-soft: #fef2d7;
  --accent-ink: #7a5300;
  --chip: #eeeeee;
  --live: #2e7d32;
  --warn: #ef6c00;
  --err: #d32f2f;
  --info: #0288d1;
  --r: 8px;
  --r-sm: 4px;
  --display: Roboto, Helvetica, Arial, sans-serif;
  --body: Roboto, Helvetica, Arial, sans-serif;
  --mono: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --surface: #1e1e1e; --ink: #ececec; --muted: #b0b0b0; --disabled: #7a7a7a;
    --line: #333333; --line-strong: #555555; --hover: rgba(255, 255, 255, 0.06);
    --accent: #fbd374; --accent-soft: rgba(251, 211, 116, 0.16); --accent-ink: #fbd374; --chip: #2c2c2c;
    --live: #81c784; --warn: #ffb74d; --err: #ef9a9a; --info: #4fc3f7; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1e1e1e; --ink: #ececec; --muted: #b0b0b0; --disabled: #7a7a7a;
  --line: #333333; --line-strong: #555555; --hover: rgba(255, 255, 255, 0.06);
  --accent: #fbd374; --accent-soft: rgba(251, 211, 116, 0.16); --accent-ink: #fbd374; --chip: #2c2c2c;
  --live: #81c784; --warn: #ffb74d; --err: #ef9a9a; --info: #4fc3f7; color-scheme: dark;
}
* { box-sizing: border-box; }
/* The page shows and hides elements with the hidden attribute; without this, a
   display rule such as .btn's wins and "hidden" buttons (Open chat on a workflow
   thunk, linking to "#") still show. */
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5; padding: 24px 16px 48px; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
a { color: inherit; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); }
.eyebrow { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* brand bar: says the page is a view of a thunk that lives on Thunk.AI */
.brand { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; }
.brand-name { display: inline-flex; align-items: center; gap: 10px; font: 500 17px var(--display); color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.brand-name svg { width: 32px; height: 32px; flex: none; }
.brand-note { font-size: 13px; color: var(--muted); }

/* header */
.head { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.head-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; justify-content: space-between; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { font-size: 13px; font-weight: 400; padding: 2px 10px; border-radius: 16px; background: var(--chip); color: var(--ink); }
.tag.kind { background: var(--accent-soft); color: var(--accent-ink); }
.tag.mode { background: transparent; border: 1px solid var(--line-strong); color: var(--muted); }
.tag.paused { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3vw, 24px); line-height: 1.3; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.goal { margin: 0; max-width: 72ch; color: var(--muted); }
.head-foot { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.counts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 400 14px var(--body); padding: 6px 16px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:hover { background: var(--hover); }
.btn.primary:hover { background: color-mix(in srgb, var(--ink) 88%, var(--bg)); }
.btn[disabled] { opacity: 0.5; cursor: default; }
.source { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.source.live .dot { background: var(--live); }
.source.warn .dot { background: var(--warn); }
.notice { font-size: 13.5px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--warn); color: var(--ink); background: var(--surface); }
.notice.err { border-color: var(--err); }

/* body grid */
.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h2 { font-family: var(--display); font-size: 16px; font-weight: 500; margin: 0; display: flex; align-items: baseline; gap: 10px; }
h2 .n { font: 500 12.5px var(--mono); color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* plan spine */
.plan { display: flex; flex-direction: column; }
.status { align-self: flex-start; margin-left: 22px; display: flex; align-items: center; gap: 8px; font: 500 12px var(--mono); color: var(--muted); padding: 6px 0; }
.status::before { content: ""; width: 2px; height: 22px; background: var(--line); margin-right: 6px; }
.status span { padding: 2px 8px; border-radius: 6px; border: 1px dashed var(--line); background: var(--bg); }
details.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
details.step[open] { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
details.step > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
details.step > summary::-webkit-details-marker { display: none; }
.idx { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font: 500 12.5px var(--mono); background: var(--chip); }
.step.intake .idx { background: var(--accent); color: #3d2e00; }
.s-title { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.s-meta { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; }
.chev { color: var(--muted); font-size: 12px; transition: transform .15s; }
details[open] .chev { transform: rotate(90deg); }
.mini { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); font-weight: 500; }
.mini.cond { color: var(--accent-ink); background: color-mix(in srgb, var(--accent) 22%, transparent); }
.mini.hitl { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.s-body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); }
.io { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding-top: 12px; }
@media (max-width: 520px) { .io { grid-template-columns: minmax(0, 1fr); } }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font: 400 12px var(--mono); padding: 1px 8px; border-radius: 16px; background: transparent; border: 1px solid var(--line-strong); overflow-wrap: anywhere; }
.none { font-size: 12.5px; color: var(--muted); }
.directions { font-size: 14px; max-width: 70ch; overflow-wrap: anywhere; }
.directions p { margin: 0 0 8px; }
.directions ul, .directions ol { margin: 0 0 8px; padding-left: 22px; }
.directions code { font: 12.5px var(--mono); background: var(--chip); padding: 0 4px; border-radius: 4px; }
.directions.clamped { max-height: 220px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.linkrow { display: flex; flex-wrap: wrap; gap: 8px; }
.textbtn { font: 500 13px var(--body); background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* contract + state */
.kv { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px 12px; align-items: start; }
.kv dt { font-size: 12.5px; color: var(--muted); padding-top: 2px; }
.kv dd { margin: 0; min-width: 0; }
.plug { display: flex; flex-direction: column; gap: 8px; }
.plug-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.plug-head b { font-size: 15px; }
.cases { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.case { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); }
.case a { font: 12px var(--mono); color: var(--muted); }
.props { display: flex; flex-direction: column; }
.prop { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.prop:first-child { border-top: 0; }
.prop .pn { font: 500 13px var(--mono); overflow-wrap: anywhere; }
.prop .pd { grid-column: 1 / 3; font-size: 12.5px; color: var(--muted); }
.ptype { display: flex; gap: 5px; align-items: center; }
.ptype .t { font: 500 10.5px var(--mono); letter-spacing: 0.04em; color: var(--muted); }
.role { font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; }
.role.in { background: var(--chip); }
.role.out { background: var(--accent); color: #3d2e00; }
.foot { font-size: 12px; color: var(--muted); }
/* work items */
.wi-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.wi-sum { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wi-sum b { color: var(--ink); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 500 12.5px var(--body); padding: 6px 12px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.wi-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.wi + .wi { border-top: 1px solid var(--line); }
.wi-cols, .wi-row { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.3fr) minmax(0, 1.5fr) minmax(0, 1fr) 64px; gap: 6px 14px; align-items: center; padding: 10px 16px; }
.wi-cols { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding-block: 8px; }
.wi-row { width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: inherit; cursor: pointer; }
.wi-row:hover { background: color-mix(in srgb, var(--chip) 60%, transparent); }
.wi-name { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 500; }
.wi-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wi-flow { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wi-flow .st { font: 500 12px var(--mono); overflow-wrap: anywhere; }
.prog { display: flex; gap: 2px; }
.prog i { flex: 1; height: 5px; border-radius: 2px; background: var(--chip); }
.prog i.on { background: color-mix(in srgb, var(--ink) 65%, transparent); }
.prog i.now { background: var(--accent); }
.age { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.run { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; min-width: 0; }
.run .dot { flex: none; }
.run.working { color: var(--live); } .run.working .dot { background: var(--live); animation: pulse 1.4s ease-in-out infinite; }
.run.needs { color: var(--warn); } .run.needs .dot { background: var(--warn); }
.run.done, .run.idle, .run.unknown { color: var(--muted); font-weight: 500; }
.tchip { font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.tchip.pass { color: var(--live); background: color-mix(in srgb, var(--live) 12%, transparent); }
.tchip.fail { color: var(--err); background: color-mix(in srgb, var(--err) 12%, transparent); }
.tag.test { font-size: 10.5px; padding: 1px 7px; background: var(--chip); color: var(--muted); flex: none; }
.wi-detail { padding: 2px 16px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.why { font-size: 13.5px; padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); }
.steps-run { display: flex; flex-direction: column; gap: 2px; }
.steps-run a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; font-size: 13px; padding: 4px 0; text-decoration: none; border-bottom: 1px dashed var(--line); }
.steps-run a:hover span:first-child { text-decoration: underline; }
.steps-run .ss { font: 500 11.5px var(--mono); color: var(--muted); }
.wi-msg { font-size: 13.5px; color: var(--muted); padding: 14px 16px; }
.vals { display: grid; grid-template-columns: minmax(120px, 0.9fr) minmax(0, 2.6fr); gap: 0 14px; font-size: 13.5px; }
.vals dt, .vals dd { margin: 0; padding: 6px 0; border-top: 1px solid var(--line); min-width: 0; }
.vals dt { font: 500 12.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.vals dd { overflow-wrap: anywhere; white-space: pre-wrap; }
.vals dd.empty { color: var(--muted); }
.vals .grp { grid-column: 1 / 3; padding: 10px 0 2px; border: 0; }
.val-long { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.subtable { overflow-x: auto; }
.subtable table { border-collapse: collapse; font-size: 12.5px; white-space: normal; }
.subtable th, .subtable td { text-align: left; padding: 3px 10px 3px 0; vertical-align: top; border-bottom: 1px dashed var(--line); }
.subtable th { font: 500 11.5px var(--mono); color: var(--muted); }
.unset { font-size: 12.5px; color: var(--muted); }
@media (max-width: 560px) { .vals { grid-template-columns: minmax(0, 1fr); } .vals dt { border-top: 1px solid var(--line); padding-bottom: 0; } .vals dd { border-top: 0; padding-top: 2px; } }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (max-width: 760px) {
  .wi-cols { display: none; }
  .wi-row { grid-template-columns: minmax(0, 1fr) auto; }
  .wi-row .wi-flow { grid-column: 1 / 3; }
  .wi-row .age { display: none; }
}
/* MCP-server card */
.mcp-grid { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .mcp-grid { grid-template-columns: minmax(0, 1fr); } }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; }
.meta-row .k { color: var(--muted); }
.url-box { display: flex; gap: 8px; align-items: center; min-width: 0; flex: 1 1 320px; }
.url-box code { font: 400 12.5px var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 5px 8px; overflow-x: auto; white-space: nowrap; min-width: 0; flex: 1; }
.tool-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tool-btn { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 10px 14px; border: 0; border-left: 3px solid transparent; background: none; color: var(--ink); font: inherit; cursor: pointer; }
.tool-btn + .tool-btn { border-top: 1px solid var(--line); }
.tool-btn:hover { background: var(--hover); }
.tool-btn[aria-selected="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.tool-btn .tn { font: 500 13px var(--mono); overflow-wrap: anywhere; }
.chiprow { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font-size: 11.5px; padding: 0 8px; border-radius: 16px; border: 1px solid var(--line-strong); color: var(--muted); line-height: 18px; white-space: nowrap; }
.pill.ok { border-color: color-mix(in srgb, var(--live) 50%, transparent); color: var(--live); }
.pill.off { border-style: dashed; }
.pill.bad { border-color: color-mix(in srgb, var(--err) 50%, transparent); color: var(--err); }
.tool-detail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tool-detail h3 { margin: 0; font: 500 18px var(--mono); overflow-wrap: anywhere; }
.tool-detail .desc { margin: 0; color: var(--muted); max-width: 75ch; }
.params { overflow-x: auto; }
.params table { border-collapse: collapse; width: 100%; font-size: 13px; }
.params th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); }
.params td { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.params td.pn { font: 400 13px var(--mono); white-space: nowrap; }
.params tr.nested td.pn { padding-left: 16px; color: var(--muted); }
.req { font-size: 11px; color: var(--err); margin-left: 4px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { font: 400 14px var(--body); padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.calls { display: flex; flex-direction: column; }
.call + .call { border-top: 1px solid var(--line); }
.call-row { display: grid; grid-template-columns: 74px 90px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 8px 4px; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.call-row:hover { background: var(--hover); }
.call-row .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.call-row .src { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.io-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 4px 4px 12px; }
@media (max-width: 640px) { .io-pair { grid-template-columns: minmax(0, 1fr); } }
pre.json { margin: 4px 0 0; font: 400 12px/1.45 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; overflow: auto; max-height: 320px; white-space: pre-wrap; overflow-wrap: anywhere; }
.form { display: grid; grid-template-columns: minmax(120px, 0.8fr) minmax(0, 2fr); gap: 10px 14px; align-items: start; }
@media (max-width: 560px) { .form { grid-template-columns: minmax(0, 1fr); } }
.form label { font: 400 13px var(--mono); padding-top: 7px; overflow-wrap: anywhere; }
.form .hint { display: block; font: 400 12px var(--body); color: var(--muted); margin-top: 2px; }
.form input, .form select, .form textarea { width: 100%; font: 400 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 7px 10px; }
.form textarea { font: 400 12.5px var(--mono); min-height: 96px; resize: vertical; }
.form input:focus, .form select:focus, .form textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.confirm { border: 1px solid var(--warn); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; background: color-mix(in srgb, var(--warn) 6%, var(--surface)); }
.result { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.result.ok { border-color: color-mix(in srgb, var(--live) 45%, var(--line)); }
.result.bad { border-color: color-mix(in srgb, var(--err) 45%, var(--line)); }
.form-err { color: var(--err); font-size: 13px; }

<script type="application/json" id="snapshot">__SNAPSHOT__</script>
<script>
(function () {
  "use strict";
  var SERVER = __SERVER__;
  var ALLOW_RUN = __ALLOW_RUN__; // false when built with --no-run: the page never asks to run tools
  var SNAP_KIND = (JSON.parse(document.getElementById("snapshot").textContent).thunk || {}).kind;
  var IS_MCP = SNAP_KIND === "mcpServer";
  var SECTIONS = IS_MCP ? ["tools", "export"] : ["properties", "steps", "planBindings", "connections", "plugIns", "tools"];
  var SNAP = JSON.parse(document.getElementById("snapshot").textContent);
  var THUNK_ID = SNAP.thunk.thunkId;
  var state = { thunk: SNAP.thunk, def: SNAP.def, live: { thunk: false, def: false }, at: null };
  var expanded = new Set(); // steps whose full instructions the viewer opened; survives live re-renders
  var KIND = { workflow: "Workflow", chatApp: "Chat app", mcpServer: "MCP server" };
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function safeUrl(u) { try { var p = new URL(String(u || "")); return p.protocol === "https:" ? p.href : "#"; } catch (e) { return "#"; } }
  function origin() { try { return new URL(state.thunk.url).origin; } catch (e) { return "https://app.thunk.ai"; } }

  // Minimal markdown for step directions: escape first, then bold, code, lists, paragraphs.
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function md(text) {
    var out = [], list = null;
    String(text || "").split(/\r?\n/).forEach(function (line) {
      var m = line.match(/^\s*(?:(\d+)[.)]|[-*])\s+(.*)$/);
      if (m) {
        var type = m[1] ? "ol" : "ul";
        if (!list || list.type !== type) { if (list) out.push("</" + list.type + ">"); list = { type: type }; out.push("<" + type + ">"); }
        out.push("<li>" + inline(m[2]) + "</li>");
        return;
      }
      if (list) { out.push("</" + list.type + ">"); list = null; }
      if (line.trim()) out.push("<p>" + inline(line) + "</p>");
    });
    if (list) out.push("</" + list.type + ">");
    return out.join("");
  }

  function chips(names) {
    if (!names || !names.length) return '<span class="none">None</span>';
    return '<div class="chips">' + names.map(function (n) { return '<span class="chip">' + esc(n) + "</span>"; }).join("") + "</div>";
  }
  function condText(c) {
    if (!c || !c.items || !c.items.length) return "";
    var op = { equals: "=", doesNotEqual: "≠", isEmpty: "is empty", isNotEmpty: "is set" };
    return c.items.map(function (i) {
      var v = Array.isArray(i.value) ? i.value.join(", ") : (i.value == null ? "" : i.value);
      return i.field + " " + (op[i.operator] || i.operator) + (v === "" ? "" : " " + v);
    }).join(c.logicOperator === "or" ? " or " : " and ");
  }
  function enabledTools(step) {
    var out = [];
    (step.toolConfig || []).forEach(function (lib) {
      if (!lib.enabled) return;
      (lib.tools || []).forEach(function (t) { if (t.enabled) out.push(t.name); });
    });
    return out;
  }

  // Order the plan by its status chain: start at the step that begins at "New" and follow finalStatus.
  function orderSteps(steps) {
    var intake = steps.filter(function (s) { return s.kind === "collect"; });
    var rest = steps.filter(function (s) { return s.kind !== "collect"; });
    var ordered = [], used = new Set(), status = "New", guard = 0;
    while (guard++ < rest.length) {
      var next = rest.find(function (s) { return !used.has(s) && s.initialStatus === status; });
      if (!next) break;
      ordered.push(next); used.add(next); status = next.finalStatus;
    }
    rest.forEach(function (s) { if (!used.has(s)) ordered.push(s); });
    return { intake: intake, steps: ordered };
  }

  function stepHtml(s, label, isIntake, open) {
    var tools = enabledTools(s), cond = condText(s.runCondition), fin = condText(s.finishCondition);
    var meta = [];
    if (cond) meta.push('<span class="mini cond">Runs when ' + esc(cond) + "</span>");
    if (s.forceHumanApproval) meta.push('<span class="mini hitl">Human finishes</span>');
    if (s.schedule && s.schedule.type === "daily") meta.push('<span class="mini">Daily ' + esc(String(s.schedule.hour).padStart(2, "0") + ":" + String(s.schedule.minute).padStart(2, "0")) + "</span>");
    if (tools.length) meta.push('<span class="mini">' + tools.length + " tool" + (tools.length === 1 ? "" : "s") + "</span>");
    if (!isIntake) meta.push('<span class="mini">' + (s.inputProperties || []).length + " in · " + (s.outputProperties || []).length + " out</span>");
    var dir = s.directions || "";
    var long = dir.length > 700 && !expanded.has(s.id);
    return '<details class="step' + (isIntake ? " intake" : "") + '"' + (open ? " open" : "") + ">" +
      '<summary><span class="idx">' + esc(label) + '</span><span class="s-title">' + esc(s.title) + '</span><span class="chev" aria-hidden="true">▶</span>' +
      (meta.length ? '<span class="s-meta">' + meta.join("") + "</span>" : "") + "</summary>" +
      '<div class="s-body">' +
      (isIntake ? "" : '<div class="io"><div><div class="eyebrow">Reads</div>' + chips(s.inputProperties) + '</div><div><div class="eyebrow">Writes</div>' + chips(s.outputProperties) + "</div></div>") +
      (tools.length ? '<div><div class="eyebrow">Tools on this step</div>' + chips(tools) + "</div>" : "") +
      (fin ? '<div><div class="eyebrow">Finishes when</div><span class="chip">' + esc(fin) + "</span></div>" : "") +
      (dir ? '<div><div class="eyebrow">AI instructions</div><div class="directions' + (long ? " clamped" : "") + '">' + md(dir) + "</div>" +
        (long ? '<button class="textbtn more" type="button">Show all instructions</button>' : "") + "</div>" : "") +
      '<div class="linkrow"><a class="btn" href="' + esc(safeUrl(s.url)) + '" target="_blank" rel="noopener">Open step ↗</a></div>' +
      "</div></details>";
  }

  function render() {
    var t = state.thunk || {}, d = state.def || {};
    var steps = d.steps || [], props = d.properties || [], plugs = d.plugIns || [];
    var userProps = props.filter(function (p) { return !p.isSystem; });
    var conns = (d.connections || []).filter(function (c) { return c.enabledOnThunk; });
    var tools = d.tools || [];

    document.title = t.name || document.title;
    var tags = '<span class="tag kind">' + esc(KIND[t.kind] || t.kind || "Thunk") + "</span>";
    if (t.status && t.status !== "ready") tags += '<span class="tag">' + esc(t.status) + "</span>";
    if (t.productionMode) tags += '<span class="tag mode">' + esc(t.productionMode) + "</span>";
    if (t.paused) tags += '<span class="tag paused">Paused</span>';
    $("tags").innerHTML = tags;
    $("name").textContent = t.name || "Untitled thunk";
    $("goal").textContent = t.goal || "";
    $("goal").hidden = !t.goal;
    $("open").href = safeUrl(t.url);
    // Chat apps: the hosted end-user chat, the same page the app's "Go to end-user chat" opens.
    $("open-chat").hidden = t.kind !== "chatApp";
    if (t.kind === "chatApp") $("open-chat").href = safeUrl(t.url ? String(t.url).replace(/\/+$/, "") + "/conversational-ui" : "");
    $("wf").hidden = IS_MCP;
    $("mcp").hidden = !IS_MCP;
    if (IS_MCP) { renderMcp(); $("foot").textContent = footText(); return; }

    var o = orderSteps(steps);
    $("counts").innerHTML =
      "<span><b>" + o.steps.length + "</b> step" + (o.steps.length === 1 ? "" : "s") + "</span>" +
      "<span><b>" + userProps.length + "</b> properties</span>" +
      (plugs.length ? "<span><b>" + plugs.length + "</b> plug-in" + (plugs.length === 1 ? "" : "s") + "</span>" : "") +
      (tools.length ? "<span><b>" + tools.length + "</b> custom tool" + (tools.length === 1 ? "" : "s") + "</span>" : "");

    // plan
    var openIds = new Set(Array.prototype.map.call(document.querySelectorAll("details.step[open]"), function (el) { return el.dataset.id; }));
    var html = [];
    o.intake.forEach(function (s) { html.push(stepHtml(s, "↓", true, openIds.has(s.id))); });
    o.steps.forEach(function (s, i) {
      html.push('<div class="status"><span>' + esc(s.initialStatus) + "</span></div>");
      html.push(stepHtml(s, String(i + 1), false, openIds.has(s.id)));
    });
    if (o.steps.length) html.push('<div class="status"><span>' + esc(o.steps[o.steps.length - 1].finalStatus) + "</span></div>");
    $("plan").innerHTML = html.join("") || '<span class="none">No workflow steps yet.</span>';
    var all = o.intake.concat(o.steps);
    Array.prototype.forEach.call($("plan").querySelectorAll("details.step"), function (el, i) { el.dataset.id = all[i].id; });
    $("plan-n").textContent = o.steps.length ? "New → " + o.steps[o.steps.length - 1].finalStatus : "";

    // io
    var pb = d.planBindings || {};
    var ins = ((pb.inputs || {}).bindings || {}).properties || [];
    var outs = ((pb.outputs || {}).bindings || {}).properties || [];
    $("io").innerHTML = "<dt>Takes</dt><dd>" + chips(ins) + "</dd><dt>Returns</dt><dd>" + chips(outs) + "</dd>";

    // plug-ins
    $("plug-sec").hidden = !plugs.length;
    $("plug-n").textContent = plugs.length ? String(plugs.length) : "";
    $("plugs").innerHTML = plugs.map(function (p) {
      var iface = p.interface || {};
      var cases = (p.bindingCases || []).map(function (c) {
        return '<div class="case"><span>' + esc(c.match) + '</span><a href="' + esc(origin() + "/thunk/" + encodeURIComponent(c.boundConnectionId)) + '" target="_blank" rel="noopener">open ↗</a></div>';
      }).join("");
      return '<div class="plug"><div class="plug-head"><b>' + esc(p.alias) + '</b><span class="mono foot">' + esc(iface.name || "") + "</span></div>" +
        chips((iface.tools || []).map(function (x) { return x.name; })) +
        (cases ? '<div class="cases"><div class="eyebrow">Bound by case</div>' + cases + "</div>" : "") + "</div>";
    }).join("");

    // connections + custom tools
    $("conn-sec").hidden = !conns.length && !tools.length;
    $("conns").innerHTML =
      (conns.length ? '<div><div class="eyebrow">Connections</div>' + chips(conns.map(function (c) { return c.name; })) + "</div>" : "") +
      (tools.length ? '<div><div class="eyebrow">Custom tools</div>' + chips(tools.map(function (x) { return x.name; })) + "</div>" : "");

    // workflow state
    $("props-n").textContent = String(userProps.length);
    var inSet = new Set(ins), outSet = new Set(outs);
    $("props").innerHTML = userProps.map(function (p) {
      var c = p.constraints || {};
      var role = inSet.has(p.name) || c.isInput ? '<span class="role in">Input</span>' : (outSet.has(p.name) || c.isResult ? '<span class="role out">Result</span>' : "");
      var type = (p.type || "") + (c.isListType ? "[]" : "");
      var desc = p.description || "";
      if (c.enum && c.enum.length) desc = (desc ? desc + " " : "") + "One of: " + c.enum.join(", ") + ".";
      return '<div class="prop"><span class="pn">' + esc(p.name) + '</span><span class="ptype"><span class="t">' + esc(type) + "</span>" + role + "</span>" +
        (desc ? '<span class="pd">' + esc(desc) + "</span>" : "") + "</div>";
    }).join("") || '<span class="none">No properties yet.</span>';

    renderWorkItems();
    $("foot").textContent = footText();
  }
  function footText() { return "Thunk ID " + THUNK_ID + (SNAP.capturedAt ? " · snapshot taken " + fmt(SNAP.capturedAt) : ""); }

  function fmt(ms) {
    try { return new Date(ms).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }); } catch (e) { return ""; }
  }
  function setSource(kind, text) {
    $("source").className = "source" + (kind ? " " + kind : "");
    $("source-text").textContent = text;
  }
  function notice(text, isErr) {
    $("notice").hidden = !text;
    $("notice").className = "notice" + (isErr ? " err" : "");
    $("notice").textContent = text || "";
  }
  function showSnapshot(why) {
    state.thunk = SNAP.thunk; state.def = SNAP.def; state.live = { thunk: false, def: false };
    render();
    setSource("warn", "Snapshot from " + fmt(SNAP.capturedAt));
    notice(why, false);
  }

  // ---- work items: live only, never part of the snapshot (they hold people's data) ----
  var WI_LIMIT = 100, STATE_WATCH_CAP = 20, WI_POLL_MS = 30000;
  var wi = { items: null, hasMore: false, at: null, msg: "", filter: "all" };
  var itemState = new Map(), stateWatch = new Map(), openItems = new Set();
  var mcpRef = null;
  var RUN = {
    RUNNING: ["working", "Working"], QUEUED: ["working", "Queued"], WAITING_ON_TOOL: ["working", "Waiting on a tool"],
    WAITING_ON_USER: ["needs", "Waiting on a person"], PAUSED: ["needs", "Paused"], NOT_STARTED: ["idle", "Not started"],
    DONE: ["done", "Step done"], SUPERSEDED: ["done", "Step done"]
  };
  var BLOCKED = {
    stepCompletionApprovalRequired: "A person needs to finish %s",
    stepApprovalRequired: "A person needs to start %s",
    draftApprovalRequired: "Draft: waiting for approval to start",
    waitingOnUserReply: "Waiting for a reply in %s",
    waitingForConversationReply: "Waiting for a conversation reply",
    doNotContinue: "Re-run finished; waiting to continue",
    paused: "Paused",
    thunkPaused: "Paused: the thunk is paused"
  };

  function stepName(title) { return String(title || "").replace(/\s*:\s*workflowItem\s+\S+$/, ""); }
  function ago(iso) {
    var t = Date.parse(iso); if (!t) return "";
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 60) return m + "m"; if (m < 1440) return Math.round(m / 60) + "h"; return Math.round(m / 1440) + "d";
  }
  function testsOf(item) {
    var raw = item.properties && item.properties.Tests;
    if (!raw) return null;
    var t = raw;
    if (typeof raw === "string") { try { t = JSON.parse(raw); } catch (e) { return null; } }
    if (!t || !Array.isArray(t.assertions) || !t.assertions.length) return null;
    var passed = 0, failed = 0;
    t.assertions.forEach(function (a) { if (a.result === "passed") passed++; else if (a.result === "failed") failed++; });
    return { total: t.assertions.length, passed: passed, failed: failed, ran: passed + failed > 0 };
  }
  function planInfo() {
    var o = orderSteps((state.def && state.def.steps) || []);
    var active = new Set(o.steps.map(function (s) { return s.initialStatus; }));
    return { steps: o.steps, active: active };
  }
  function isActive(item, plan) { return item.status === "Draft" || plan.active.has(item.status); }
  function runOf(item, plan) {
    if (!isActive(item, plan)) return { cls: "done", text: "Finished" };
    var st = itemState.get(item.workItemId);
    if (!st) return stateWatch.has(item.workItemId) ? { cls: "unknown", text: "Checking…" } : { cls: "unknown", text: "Open to check" };
    var task = st.aiTask || {};
    if (st.blocked && st.blocked.reason && st.blocked.reason !== "workitem run") {
      var tpl = BLOCKED[st.blocked.reason] || "Waiting";
      var where = task.stepTitle ? "“" + stepName(task.stepTitle) + "”" : "the step";
      return { cls: "needs", text: tpl.replace("%s", where) };
    }
    var r = RUN[task.status];
    return r ? { cls: r[0], text: r[1] } : { cls: "idle", text: "Idle" };
  }
  function progHtml(item, plan) {
    var n = plan.steps.length; if (!n) return "";
    var idx = plan.steps.findIndex(function (s) { return s.initialStatus === item.status; });
    var done = idx >= 0 ? idx : (item.status === "Draft" || item.status === "New" ? 0 : n);
    var out = "";
    for (var i = 0; i < n; i++) out += "<i class=\"" + (i < done ? "on" : i === idx ? "now" : "") + "\"></i>";
    return '<span class="prog" aria-hidden="true">' + out + "</span>";
  }
  function testChip(t) {
    if (!t) return "";
    if (!t.ran) return '<span class="tchip">Not run</span>';
    if (t.failed) return '<span class="tchip fail">' + t.failed + " of " + t.total + " failed</span>";
    return '<span class="tchip pass">' + t.passed + "/" + t.total + " passed</span>";
  }
  // Property values of one work item, in workflow-state order: inputs, then results, then the rest.
  var revealed = new Set(); // "<itemId>/<prop>" values the viewer chose to show (sensitive or long)
  function cellText(v) {
    if (v == null || v === "") return "";
    return typeof v === "object" ? JSON.stringify(v) : String(v);
  }
  function valueHtml(v, prop, key) {
    var c = prop.constraints || {};
    if (c.isSensitive && !revealed.has(key)) return '<button class="textbtn reveal" type="button" data-key="' + esc(key) + '">Show sensitive value</button>';
    if ((prop.type === "FILE" || prop.type === "IMAGE") && typeof v === "string" && /^https:\/\//i.test(v)) {
      return '<a href="' + esc(v) + '" target="_blank" rel="noopener">Open file ↗</a>';
    }
    if (Array.isArray(v) && v.length && v.every(function (x) { return x && typeof x === "object" && !Array.isArray(x); })) {
      var cols = [];
      v.forEach(function (row) { Object.keys(row).forEach(function (k) { if (cols.indexOf(k) < 0 && cols.length < 6) cols.push(k); }); });
      return '<div class="subtable"><table><thead><tr>' + cols.map(function (k) { return "<th>" + esc(k) + "</th>"; }).join("") + "</tr></thead><tbody>" +
        v.map(function (row) { return "<tr>" + cols.map(function (k) { return "<td>" + esc(cellText(row[k])) + "</td>"; }).join("") + "</tr>"; }).join("") +
        "</tbody></table></div>";
    }
    var text = Array.isArray(v) ? v.map(cellText).join(", ") : (typeof v === "object" ? JSON.stringify(v, null, 2) : String(v));
    var shown = revealed.has(key);
    if (text.length > 400 && !shown) return '<div class="val-long">' + esc(text) + '</div><button class="textbtn reveal" type="button" data-key="' + esc(key) + '">Show all</button>';
    return esc(text);
  }
  function valuesHtml(item, values) {
    var props = ((state.def && state.def.properties) || []).filter(function (p) { return !p.isSystem; });
    var known = new Set(props.map(function (p) { return p.name; }));
    // A value for a property the (possibly older) definition doesn't list still shows, as plain text.
    Object.keys(values || {}).forEach(function (n) { if (!known.has(n) && ["Name", "Status", "AssignedTo", "Tests", "Validation Results"].indexOf(n) < 0) props.push({ name: n }); });
    var groups = { input: [], result: [], other: [] }, unset = [];
    props.forEach(function (p) {
      var v = values ? values[p.name] : undefined;
      if (v == null || v === "" || (Array.isArray(v) && !v.length)) { unset.push(p.name); return; }
      var c = p.constraints || {};

        '<div class="linkrow"><button class="btn primary" type="button" id="run-go">Run tool</button><button class="btn" type="button" id="run-cancel">Cancel</button></div></div>';
    } else {
      html += '<div class="linkrow"><button class="btn primary" type="button" id="run-ask"' + (mcpUi.running ? " disabled" : "") + ">" + (mcpUi.running ? "Running…" : "Run…") + "</button></div>";
    }
    var r = mcpUi.result[tool.name];
    if (r) {
      var good = r.outcome === "success";
      html += '<div class="result ' + (r.error ? "bad" : good ? "ok" : "bad") + '"><div class="meta-row">' +
        '<span class="pill ' + (r.error ? "bad" : good ? "ok" : "bad") + '">' + esc(r.error ? "failed to run" : r.outcome || r.status || "done") + "</span>" +
        (r.durationMs != null ? '<span class="k">' + esc((r.durationMs / 1000).toFixed(1)) + " s</span>" : "") +
        (r.at ? '<span class="k">' + esc(fmt(r.at)) + "</span>" : "") + "</div>" +
        (r.error ? '<div class="form-err">' + esc(r.error) + "</div>" : '<pre class="json">' + esc(prettyOut(r.output)) + "</pre>" + (r.truncated ? '<span class="none">Output was cut short.</span>' : "")) + "</div>";
    }
    return html;
  }
  function runMessage(err) {
    var code = (err && err.code) || "upstream_error";
    return {
      tool_error: "Thunk.AI refused the run" + (err && err.message ? ": " + err.message : "") + ".",
      not_in_manifest: "Running tools is turned off for this page, or you declined it when asked.",
      consent_required: "Running tools is turned off for this page, or you declined it when asked.",
      needs_reauth: "Reconnect " + SERVER + " in claude.ai Settings → Connectors, then try again.",
      server_not_connected: "Add the " + SERVER + " connector in claude.ai Settings → Connectors, then try again.",
      cancelled: "The run was cancelled."
    }[code] || ("The run's outcome is unknown (" + code + "). Check the tool's call history before running it again.");
  }
  function finishRun(name, payload) {
    var res = (payload && payload.result) || {};
    mcpUi.result[name] = { outcome: res.outcome, status: payload && payload.status, output: res.output != null ? res.output : res.error, truncated: !!res.truncated, durationMs: payload && payload.durationMs, at: Date.now() };
    mcpUi.running = false;
    if (mcpUi.api) Promise.resolve(mcpUi.api.invalidate(SERVER, "get_tool_call_history")).catch(function () {});
    if (mcpUi.selected === name) renderToolDetail();
  }
  function pollRun(name, runId, tries) {
    if (tries > 100) { mcpUi.result[name] = { error: "Still running after 5 minutes. Check the call history or the thunk for its result.", at: Date.now() }; mcpUi.running = false; renderToolDetail(); return; }
    setTimeout(function () {
      mcpUi.api.callTool(SERVER, "get_tool_run", { thunkId: THUNK_ID, runId: runId, maxOutputChars: 20000 }, { cache: false }).then(function (r) {
        var p = r && r.payload;
        if (p && (p.status === "in_progress" || p.status === "running" || p.status === "queued")) return pollRun(name, runId, tries + 1);
        finishRun(name, p);
      }, function (err) {
        if (err && err.retryable) return pollRun(name, runId, tries + 1);
        mcpUi.result[name] = { error: runMessage(err), at: Date.now() }; mcpUi.running = false; renderToolDetail();
      });
    }, 3000);
  }
  function runTool(tool) {
    var got = collectInput(tool);
    mcpUi.confirm = false;
    if (got.error) { mcpUi.formErr = got.error; renderToolDetail(); return; }
    mcpUi.formErr = ""; mcpUi.running = true; delete mcpUi.result[tool.name]; renderToolDetail();
    // One call per click, never retried: a failed run may still have happened.
    mcpUi.api.callTool(SERVER, "run_tool", { thunkId: THUNK_ID, toolName: tool.name, input: got.input, maxOutputChars: 20000, wait: { timeoutMs: 60000 } }, { cache: false }).then(function (r) {
      var p = r && r.payload;
      if (p && p.runId && p.status !== "completed" && !(p.result && p.result.outcome)) return pollRun(tool.name, p.runId, 0);
      finishRun(tool.name, p);
    }, function (err) {
      mcpUi.result[tool.name] = { error: runMessage(err), at: Date.now() }; mcpUi.running = false; renderToolDetail();
    });
  }

  $("mcp").addEventListener("click", function (e) {
    var t = e.target;
    var tb = t.closest(".tool-btn");
    if (tb) { mcpUi.selected = tb.dataset.tool; mcpUi.confirm = false; mcpUi.formErr = ""; renderMcp(); return; }
    var tab = t.closest("[data-tab]");
    if (tab) { mcpUi.tab = tab.dataset.tab; mcpUi.confirm = false; renderToolDetail(); return; }
    var call = t.closest(".call-row");
    if (call) { var id = call.dataset.call; if (mcpUi.openCalls.has(id)) mcpUi.openCalls.delete(id); else mcpUi.openCalls.add(id); $("tab-body").innerHTML = historyHtml({ name: mcpUi.selected }); return; }
    if (t.id === "copy-url") {
      var text = ($("mcp-url") || {}).textContent || "";
      var done = function () { t.textContent = "Copied"; setTimeout(function () { t.textContent = "Copy"; }, 1500); };
      try { navigator.clipboard.writeText(text).then(done, function () { selectText($("mcp-url")); }); } catch (err) { selectText($("mcp-url")); }
      return;
    }
    var tool = toolsAndExport().tools.filter(function (x) { return x.name === mcpUi.selected; })[0];
    if (!tool) return;
    if (t.id === "run-ask") { var g = collectInput(tool); mcpUi.formErr = g.error || ""; mcpUi.confirm = !g.error; renderToolDetail(); return; }
    if (t.id === "run-cancel") { mcpUi.confirm = false; renderToolDetail(); return; }
    if (t.id === "run-go") { runTool(tool); }
  });
  $("mcp").addEventListener("input", function (e) {
    var el = e.target; if (!el.dataset || !el.dataset.prop) return;
    formValues({ name: mcpUi.selected, inputSchema: (toolsAndExport().tools.filter(function (x) { return x.name === mcpUi.selected; })[0] || {}).inputSchema })[el.dataset.prop] = el.value;
  });
  function selectText(el) {
    if (!el) return;
    try { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) { /* nothing to select */ }
  }

  $("plan").addEventListener("click", function (e) {
    var b = e.target.closest(".more");
    if (!b) return;
    var step = b.closest("details.step");
    if (step && step.dataset.id) expanded.add(step.dataset.id);
    var d = b.previousElementSibling;
    d.classList.remove("clamped");
    b.remove();
  });

  render();
  setSource("", "Snapshot from " + fmt(SNAP.capturedAt) + " · connecting…");

  function onError(err) {
    var code = (err && err.code) || "upstream_error";
    if (code === "server_unavailable" || code === "rate_limited") {
      if (state.live.thunk || state.live.def) { setSource("warn", "Thunk.AI didn't answer · showing data from " + fmt(state.at)); return; }
      return showSnapshot("Thunk.AI didn't answer, so this is the saved snapshot. Use Refresh to try again.");
    }
    var why = {
      needs_reauth: "Your " + SERVER + " connection has expired. Reconnect it in claude.ai Settings → Connectors to see the live design.",
      server_not_connected: "Add the " + SERVER + " connector in claude.ai Settings → Connectors to see the live design. This is the saved snapshot.",
      selection_required: "You have more than one " + SERVER + " connector. Choose one when Claude asks to see the live design.",
      not_in_manifest: "Live data is turned off for this page. This is the saved snapshot.",
      consent_required: "Live data is turned off for this page. This is the saved snapshot.",
      blocked_by_policy: "Your organization's policy blocks this page from reading Thunk.AI. This is the saved snapshot.",
      approval_required: "Your organization requires approval to read Thunk.AI from this page. This is the saved snapshot.",
      tool_error: "Thunk.AI couldn't load this thunk for you" + (err && err.message ? ": " + err.message : "") + ". You may not have access to it, or it was deleted. This is the saved snapshot."
    }[code] || "Couldn't load the live design (" + code + "). This is the saved snapshot.";
    showSnapshot(why);
  }

  var lastPayload = {};
  function onData(which, ev) {
    if (ev.type === "error") return onError(ev.error);
    var payload = ev.result && ev.result.payload;
    if (!payload || typeof payload !== "object") return onError({ code: "upstream_error" });
    var key = JSON.stringify(payload), changed = lastPayload[which] !== key;
    lastPayload[which] = key;
    if (which === "thunk") state.thunk = payload; else state.def = payload;
    state.live[which] = true;
    var at = ev.result.cache && ev.result.cache.storedAt ? ev.result.cache.storedAt : Date.now();
    state.at = at;
    if (changed) render();
    if (state.live.thunk && state.live.def) { setSource("live", "Live · updated " + fmt(at)); notice(""); }
  }

  function noLive() {
    setSource("warn", "Snapshot from " + fmt(SNAP.capturedAt));
    wi.msg = "Work items show only when this page can read Thunk.AI live. Open the thunk to see them.";
    mcpUi.offline = true;
    if (IS_MCP) renderMcp(); else renderWorkItems();
  }
  if (!SERVER || !window.claude || typeof window.claude.use !== "function") { noLive(); return; }
  window.claude.use("mcp").then(function (mcp) {
    if (!mcp) { noLive(); return; }
    var opts = { refetchInterval: 60000 };
    mcp.watchTool(SERVER, "get_thunk", { thunkId: THUNK_ID }, function (ev) { onData("thunk", ev); }, opts);
    mcp.watchTool(SERVER, "get_definition", { thunkId: THUNK_ID, sections: SECTIONS }, function (ev) { onData("def", ev); }, opts);
    mcpUi.api = mcp;
    if (IS_MCP) renderMcp(); else watchWorkItems(mcp);
    var btn = $("refresh");
    btn.hidden = false;
    btn.addEventListener("click", function () {
      btn.disabled = true;
      setSource("", "Refreshing…");
      lastPayload = {};
      Promise.resolve(mcp.invalidate(SERVER)).catch(function () {}).then(function () { btn.disabled = false; });
    });
  }, noLive);
})();
</script>
